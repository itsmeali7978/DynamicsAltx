<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DynamicsAltx - Vendor Pending Tasks</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            margin-top: 1.5rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .data-table th, .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .data-table th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .data-table tbody tr {
            transition: var(--transition);
        }

        .data-table tbody tr:hover {
            background: #f8fafc;
        }

        .data-table .task-cell {
            text-align: center;
            vertical-align: middle;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
            margin: 0;
            vertical-align: middle;
            display: inline-block;
        }

        .task-disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .btn-close-tasks {
            background: #dc2626;
            color: white;
            border: none;
            padding: 0.7rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
            transition: all 0.2s ease-in-out;
            margin-top: 1.5rem;
        }

        .btn-close-tasks:hover:not(:disabled) {
            transform: translateY(-2px);
            background: #b91c1c;
            box-shadow: 0 6px 18px rgba(220, 38, 38, 0.35);
        }
        
        .btn-close-tasks:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .actions-bar {
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>

<body>
    <div class="erp-app">
        <!-- Sidebar Navigation -->
        <div id="sidebar-container"></div>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger-menu" id="mobile-menu-btn">
                        <i class="ri-menu-line"></i>
                    </button>
                    <h2 class="page-title">Vendor Pending Tasks</h2>
                </div>
            </header>

            <div class="content">
                <div class="page-header">
                    <div>
                        <h3>Pending Tasks Overview</h3>
                        <p class="text-muted">View all active vendor tasks. Select tasks to close them.</p>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table" id="pending-tasks-table">
                        <thead>
                            <tr id="table-header-row">
                                <!-- Headers injected via JS -->
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
                
                <div class="actions-bar">
                    <button class="btn-close-tasks" id="btn-close-selected" disabled>
                        <i class="ri-check-double-line"></i>
                        <span>Close Selected Tasks</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom JS -->
    <script src="common.js?v=13"></script>
    <script src="vendor-pending-tasks.js"></script>
</body>

</html>
