<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DynamicsAltx - Voucher Entries</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .search-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            align-items: flex-end;
        }

        .search-section .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .search-section label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .search-section input {
            padding: 0.8rem 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-section input[type="text"] {
            min-width: 250px;
        }

        .search-section input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            height: 45px;
        }

        .btn-action:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .data-table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            padding: 1rem 1.5rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .info-message {
            display: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease-in;
            align-items: center;
            gap: 1rem;
            font-weight: 500;
        }

        .info-message.error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .info-message.success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .info-message.warning {
            background-color: #fef08a;
            color: #854d0e;
            border: 1px solid #fde047;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="erp-app">
        <!-- Sidebar Navigation -->
        <div id="sidebar-container"></div>

        <!-- Main Workspace -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger-menu" id="mobile-menu-btn">
                        <i class="ri-menu-line"></i>
                    </button>
                    <h2 class="page-title">Voucher Entries</h2>
                </div>
            </header>

            <div class="content">
                <div id="message-container" class="info-message"></div>

                <div class="search-section">
                    <div class="input-group">
                        <label for="filter-date">Filter by Date</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="date" id="filter-date">
                            <button class="btn-action" id="clear-date-btn" style="background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1;">
                                <i class="ri-close-line"></i>
                                <span>Clear</span>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="filter-location">Filter by Location</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="text" id="filter-location" placeholder="e.g. HO" style="min-width: 150px;">
                            <button class="btn-action" id="clear-location-btn" style="background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1;">
                                <i class="ri-close-line"></i>
                                <span>Clear</span>
                            </button>
                        </div>
                    </div>
                    
                    <div style="flex:1;"></div>

                    <div class="input-group">
                        <label for="voucher-input">Check Voucher Status</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="text" id="voucher-input" placeholder="Enter Voucher Number...">
                            <button class="btn-action" id="check-status-btn">
                                <i class="ri-search-eye-line"></i>
                                <span>Check Status</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="page-header">
                    <div>
                        <h3>Entered Vouchers</h3>
                        <p class="text-muted">Showing the latest 20 entered records.</p>
                    </div>
                </div>

                <div class="data-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Voucher No</th>
                                <th>Transaction Date</th>
                                <th>Created Date</th>
                                <th>User</th>
                                <th>Location</th>
                            </tr>
                        </thead>
                        <tbody id="vouchers-table-body">
                            <!-- Data populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom JS -->
    <script src="common.js?v=13"></script>
    <script src="voucher-entries.js"></script>
</body>

</html>
